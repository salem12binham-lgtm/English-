const mix=(...ls)=>ls.flatMap((L,k)=>L.map((x,i)=>[i/L.length+k*1e-6,x])).sort((a,b)=>a[0]-b[0]).map(p=>p[1]);
const WORDS_PER_DAY=5, PHR_PER_DAY=2;
const VOCAB = mix(parse(W_G,"g"),parse(W_B,"b")).map((v,i)=>({...v,day:Math.floor(i/WORDS_PER_DAY)+1}));
const PHRASES = mix(...Object.entries(P_RAW).map(([c,t])=>parse(t,c))).map((p,i)=>({...p,day:Math.floor(i/PHR_PER_DAY)+1}));

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800)}
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-US/.test(v.lang)&&/Samantha|Google|Natural/i.test(v.name))||vs.find(v=>/^en/.test(v.lang))||null}

function speak(text,rate=0.95){

}

/* ====== تدفق درس اليوم ====== */
let D=null;
function startDay(n){
  const steps=["words","spell",dayPhrases(n).length?"phrases":null,dayLesson(n)?"lesson":null,"quiz",ieltsTest(n)?"ielts":null].filter(Boolean);
  D = S.dayProg?.n===n ? {...S.dayProg,steps} : {n,s:0,i:0,steps,ok:0};
  dayStep();
}
function saveProg(){S.dayProg={n:D.n,s:D.s,i:D.i,ok:D.ok};save()}
function dayHead(label){
  const pct=Math.round(D.s/D.steps.length*100);
  return `<div class="row" style="justify-content:space-between;margin-bottom:6px"><button class="btn ghost" id="dback">→ الرئيسية</button><span class="mute">اليوم ${D.n} — ${label}</span></div><div class="bar" style="margin-bottom:12px"><i style="width:${pct}%"></i></div>`;
}
function nextStep(){D.s++;D.i=0;saveProg();dayStep()}
function bindBack(){$("#dback").onclick=()=>{D=null;render()}}
function dayStep(){
  scrollTo(0,0);
  const st=D.steps[D.s];
  if(!st)return finishDay();
  if(st==="words"){
    const W=dayWords(D.n), v=W[D.i];
    if(!S.cards[v.id]){S.cards[v.id]={box:0,due:Date.now()+864e5};save()}
    $("#app").innerHTML=dayHead(`كلمة ${D.i+1} من ${W.length}`)+`
      <div class="card flash" style="cursor:default">
        <span class="badge">${v.c==="b"?"أعمال":"عامة"}</span>
        <div class="row" style="justify-content:center;margin-top:8px"><span class="word en">${v.en}</span>${sayBtn(v.en)}${sayBtn(v.en,true)}</div>
        <div class="ar">${v.ar}</div>
        <div class="row" style="justify-content:center"><div class="ex en">${v.ex}</div>${sayBtn(v.ex)}</div>
      </div>
      <button class="btn" id="dn" style="width:100%">${D.i<W.length-1?"الكلمة التالية":"التالي: الإملاء"}</button>`;
    speak(v.en); bindBack();
    $("#dn").onclick=()=>{D.i++; if(D.i>=W.length)nextStep(); else {saveProg();dayStep()}};
  }
  else if(st==="phrases"){
    const P=dayPhrases(D.n), p=P[D.i];
    $("#app").innerHTML=dayHead(`جملة ${D.i+1} من ${P.length}`)+`
      <div class="card" style="text-align:center">
        <span class="badge">${p.c}</span>
        <h2 class="en" style="margin-top:8px">${p.en}</h2><p>${p.ar}</p>
        <div class="row" style="justify-content:center">${sayBtn(p.en)}${sayBtn(p.en,true)}</div>
        <div style="margin:18px 0 6px"><button class="mic" id="mic">🎤</button></div>
        <p class="mute" id="hint">${SR?"استمع، بعدين اضغط المايك وقلها":"متصفحك ما يدعم المايك — استمع وردد بصوت عالي"}</p>
        <div id="res"></div>
      </div>
      <button class="btn" id="dn" style="width:100%">${D.i<P.length-1?"الجملة التالية":"التالي"}</button>`;
    bindBack();
    $("#mic").onclick=()=>listen(p.en);
    $("#dn").onclick=()=>{D.i++; if(D.i>=P.length)nextStep(); else {saveProg();dayStep()}};
  }
  else if(st==="lesson"){
    openLesson(dayLesson(D.n).id, nextStep, dayHead("الدرس"));
    bindBack();
  }
  else if(st==="spell"){
    const W=dayWords(D.n);
    const extra=shuffle(spellDue().filter(v=>!W.includes(v))).slice(0,10);
    dictation({list:[...W,...extra],head:dayHead,after:bindBack,onDone:nextStep,title:"إملاء"});
  }
  else if(st==="ielts"){
    startTest(ieltsTest(D.n).id, nextStep);
  }
  else if(st==="quiz"){
    const W=dayWords(D.n);
    if(D.i>=W.length){nextStep();return}
    const v=W[D.i];
    const pool=learned().filter(x=>x!==v);
    const opts=shuffle([v,...shuffle(pool).slice(0,3)]);
    $("#app").innerHTML=dayHead(`اختبار ${D.i+1} من ${W.length}`)+`<div class="card">
      <p class="mute">وش معنى:</p>
      <div class="row"><h2 class="en" style="margin:0">${v.en}</h2>${sayBtn(v.en)}</div>
      <div style="margin-top:12px" id="qo">${opts.map(o=>`<button class="opt" data-id="${esc(o.id)}">${o.ar}</button>`).join("")}</div>
      <div id="qf"></div></div>`;
    bindBack();
    $("#qo").onclick=e=>{
      const b=e.target.closest(".opt"); if(!b||$("#qo").dataset.done)return; $("#qo").dataset.done=1;
      const right=b.dataset.id===v.id;
      document.querySelectorAll("#qo .opt").forEach(x=>{if(x.dataset.id===v.id)x.classList.add("right")});
      if(!right){b.classList.add("wrong");S.cards[v.id]={box:0,due:Date.now()}} else {D.ok++;addXP(1)}
      $("#qf").innerHTML=`<p class="en mute">${v.ex}</p><button class="btn" id="qn" style="width:100%">التالي</button>`;
      $("#qn").onclick=()=>{D.i++;saveProg();dayStep()};
    };
  }
}
function finishDay(){
  const n=D.n; D=null; S.dayProg=null;
  if(n===S.doneDays+1){S.doneDays=n; S.lastDoneDate=today();}
  addXP(20);

    <button class="btn" id="hm">الرئيسية</button></div>`;
  $("#hm").onclick=render;
}

    box.innerHTML=`<div class="card" style="text-align:center"><h3>🎉 ما فيه مراجعة مستحقة</h3><p class="mute">البطاقات ترجع لك تلقائياً في وقتها.</p><button class="btn ghost" id="more">راجع كلمات إضافية</button></div>`;

    return;

  box.innerHTML=`
   <p class="mute">${qi+1} / ${queue.length}</p>
   <div class="card flash" id="fc">
     <div class="row" style="justify-content:center"><span class="word en">${v.en}</span>${sayBtn(v.en)}</div>
     ${flipped?`<div class="ar">${v.ar}</div><div class="row" style="justify-content:center"><div class="ex en">${v.ex}</div>${sayBtn(v.ex)}</div>`:`<p class="mute">تذكر المعنى، بعدين اضغط</p>`}
   </div>
   ${flipped?`<div class="grid"><button class="btn bad" id="no">ما عرفتها</button><button class="btn ok" id="yes">عرفتها</button></div>`:""}`;
  $("#fc").onclick=()=>{if(!flipped){flipped=true;card();speak(v.en)}};

function grade(v,ok){
  const c=S.cards[v.id]||{box:0,due:0};
  c.box= ok? Math.min(c.box+1,DAYS.length-1) : 0;
  c.due= Date.now()+DAYS[c.box]*864e5 - (c.box?36e5:0);
  S.cards[v.id]=c;
  if(!ok) queue.push(v);
  qi++; flipped=false;
  if(ok) addXP(2); else save();
  card();
}

/* ====== المحادثة والنطق ====== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let pCat="الكل", pIdx=0, rec=null;
function Speak(){
  const od=openDay();
  const list=PHRASES.filter(p=>p.day<=od&&(pCat==="الكل"||p.c===pCat));
  const seg=`<div class="seg" id="pc">${["الكل",...PCATS].map(k=>`<button data-c="${k}" class="${k===pCat?"on":""}">${k}</button>`).join("")}</div>`;
  if(!list.length){
    $("#app").innerHTML=seg+`<div class="card" style="text-align:center"><p>جمل هذا القسم تفتح مع الأيام الجاية.</p></div>`;
    $("#pc").onclick=e=>{const b=e.target.closest("button");if(!b)return;pCat=b.dataset.c;pIdx=0;Speak()};
    return;
  }
  if(pIdx>=list.length)pIdx=0;
  const p=list[pIdx], best=S.speak[p.en];
  const locked=PHRASES.length-PHRASES.filter(x=>x.day<=od).length;
  $("#app").innerHTML=seg+`
   <div class="card" style="text-align:center">
     <p class="mute">${pIdx+1} / ${list.length}</p>
     <h2 class="en">${p.en}</h2>
     <p>${p.ar}</p>
     <div class="row" style="justify-content:center">${sayBtn(p.en)}${sayBtn(p.en,true)}</div>
     <div style="margin:18px 0 6px"><button class="mic" id="mic">🎤</button></div>
     <p class="mute" id="hint">${SR?"اضغط المايك وقل الجملة":"متصفحك ما يدعم التعرّف على الصوت — جرّب Chrome أو Safari الحديث"}</p>
     <div id="res">${best!=null?`<p class="mute">أفضل نتيجة لك: ${best}%</p>`:""}</div>
     <div class="grid" style="margin-top:12px"><button class="btn ghost" id="prev">السابقة</button><button class="btn ghost" id="next">التالية</button></div>
   </div>
   <div class="card"><h3>جملك</h3>${list.map((x,i)=>`<div class="item" data-i="${i}"><div class="t en">${x.en}</div>${S.speak[x.en]!=null?`<span class="badge ${S.speak[x.en]>=80?"done":""}">${S.speak[x.en]}%</span>`:""}</div>`).join("")}
   ${locked?`<p class="mute">🔒 ${locked} جملة تفتح مع الأيام الجاية</p>`:""}</div>`;
  $("#pc").onclick=e=>{const b=e.target.closest("button");if(!b)return;pCat=b.dataset.c;pIdx=0;Speak()};
  $("#prev").onclick=()=>{pIdx=(pIdx-1+list.length)%list.length;Speak()};
  $("#next").onclick=()=>{pIdx=(pIdx+1)%list.length;Speak()};
  document.querySelectorAll(".item[data-i]").forEach(it=>it.onclick=()=>{pIdx=+it.dataset.i;Speak();scrollTo(0,0)});
  $("#mic").onclick=()=>listen(p.en);
}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
function scoreSpeech(target,said){
  const T=norm(target), S2=norm(said);
  const dp=Array.from({length:T.length+1},()=>Array(S2.length+1).fill(0));
  for(let i=T.length-1;i>=0;i--)for(let j=S2.length-1;j>=0;j--)dp[i][j]=T[i]===S2[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Set();let i=0,j=0;
  while(i<T.length&&j<S2.length){if(T[i]===S2[j]){ok.add(i);i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return {pct:Math.round(ok.size/T.length*100), T, ok};
}
function listen(target){
  if(!SR){toast("التعرف على الصوت غير مدعوم في هذا المتصفح");return}
  if(rec){rec.stop();return}
  speechSynthesis.cancel();
  rec=new SR(); rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=5;
  $("#mic").classList.add("rec"); $("#hint").textContent="أسمعك… تكلم الحين";
  rec.onresult=e=>{
    const alts=[...e.results[0]].map(a=>a.transcript);
    let best=null,bestSaid="";
    for(const a of alts){const r=scoreSpeech(target,a);if(!best||r.pct>best.pct){best=r;bestSaid=a}}
    const prev=S.speak[target]??0;
    if(best.pct>prev)S.speak[target]=best.pct;
    if(best.pct>=80&&prev<80)addXP(5); else save();
    $("#res").innerHTML=`
      <div class="feedback ${best.pct>=80?"ok":"bad"}">
        <b style="font-size:22px">${best.pct}%</b> ${best.pct>=90?"ممتاز 👏":best.pct>=80?"زين جداً":best.pct>=50?"قريب، جرّب مرة ثانية":"حاول مرة ثانية بهدوء"}
        <p class="en" style="margin:8px 0 0">${best.T.map((w,i)=>`<span class="${best.ok.has(i)?"w-ok":"w-bad"}">${w}</span>`).join(" ")}</p>
        <p class="mute en" style="margin:4px 0 0">You said: "${esc(bestSaid)}"</p>
      </div>`;
  };
  rec.onerror=e=>{toast(e.error==="not-allowed"?"اسمح للموقع باستخدام المايك":"ما سمعت شي، جرّب مرة ثانية")};
  rec.onend=()=>{rec=null;const m=$("#mic");if(m){m.classList.remove("rec");$("#hint").textContent="اضغط المايك وقل الجملة"}};
  rec.start();
}

/* ====== الدروس (قواعد + أعمال) ====== */
function LessonList(kind,el="#app",title){
  const od=openDay();
  const L=LESSONS.filter(l=>l.kind===kind).sort((a,b)=>a.day-b.day);
  const html=`<div class="card">${title?`<h3>${title}</h3>`:""}${L.map(l=>{const s=S.lessons[l.id],open=l.day<=od;return`
    <div class="item${open?"":" locked"}" ${open?`data-l="${l.id}"`:""}><div class="t">${open?"":"🔒 "}${l.title}</div><span class="badge ${s!=null?"done":""}">${!open?`يفتح يوم ${l.day}`:s!=null?`${s}/${l.qs.length}`:`${l.qs.length} أسئلة`}</span></div>`}).join("")}</div>`;
  $(el).innerHTML=html;
  document.querySelectorAll("[data-l]").forEach(it=>it.onclick=()=>openLesson(it.dataset.l));
}
let LS=null;
function openLesson(id,onDone,top){
  const l=LESSONS.find(x=>x.id===id); LS={l,i:-1,ok:0,onDone};
  $("#app").innerHTML=(top||`<button class="btn ghost" id="back" style="margin-bottom:10px">→ رجوع</button>`)+`
    <div class="card lesson"><h2>${l.title}</h2>${l.body}<button class="btn" id="startQ" style="margin-top:10px">ابدأ التمارين</button></div><div id="qz"></div>`;
  if(!top)$("#back").onclick=render;
  $("#startQ").onclick=()=>{$("#startQ").remove();nextQ()};
  scrollTo(0,0);
}
function nextQ(){
  LS.i++; const {l}=LS, box=$("#qz");
  if(LS.i>=l.qs.length){
    const prev=S.lessons[l.id];
    if(prev==null||LS.ok>prev)S.lessons[l.id]=LS.ok;
    addXP(LS.ok*5); save();
    box.innerHTML=`<div class="card" style="text-align:center"><h3>النتيجة: ${LS.ok} / ${l.qs.length}</h3>
      <div class="row" style="justify-content:center">${LS.onDone?`<button class="btn" id="cont">متابعة</button>`:`<button class="btn ghost" id="retry">أعد الدرس</button><button class="btn" id="done">رجوع للدروس</button>`}</div></div>`;
    if(LS.onDone)$("#cont").onclick=LS.onDone;
    else{$("#retry").onclick=()=>openLesson(l.id); $("#done").onclick=render;}
    return;
  }
  const q=l.qs[LS.i];
  box.innerHTML=`<div class="card"><p class="mute">سؤال ${LS.i+1} / ${l.qs.length}</p>
    <h3 class="en">${q.q}</h3><div id="qo">${q.o.map((o,i)=>`<button class="opt en" data-i="${i}">${o}</button>`).join("")}</div><div id="qf"></div></div>`;
  $("#qo").onclick=e=>{
    const b=e.target.closest(".opt"); if(!b||$("#qo").dataset.done)return; $("#qo").dataset.done=1;
    const i=+b.dataset.i, right=i===q.a;
    document.querySelectorAll("#qo .opt")[q.a].classList.add("right");
    if(!right)b.classList.add("wrong"); else LS.ok++;
    $("#qf").innerHTML=`<div class="feedback ${right?"ok":"bad"}">${right?"✅ صح":"❌ خطأ"} — ${q.w}</div><button class="btn" id="qn" style="margin-top:10px">التالي</button>`;
    $("#qn").onclick=nextQ;
  };
  box.scrollIntoView({behavior:"smooth",block:"start"});
}

function testHead(label,i){
  const secs=["Listening","Reading","Writing","Speaking"];
  return `<div class="row" style="justify-content:space-between;margin-bottom:6px"><button class="btn ghost" id="tback">→ خروج</button><span class="pill">IELTS ${T.t.n} — ${label}</span></div>
  <div class="steps">${secs.map((s,k)=>`<span class="${k<i?"done":k===i?"cur":""}">${s}</span>`).join("")}</div>`;
}
function bindTBack(){$("#tback").onclick=()=>{if(confirm("تبغى تطلع من الاختبار؟ ما راح تنحفظ إجاباتك.")){speechSynthesis.cancel();if(rec)rec.stop();T=null;if(typeof D!=="undefined"&&D)dayStep();else render()}}}
function qHTML(q,i,pre){
  if(q.t==="gap")return `<div class="tq"><span class="qn">${i+1}</span><div class="t en">${q.q.replace("___",`<input class="gap" data-q="${pre}${i}" autocomplete="off" autocapitalize="off">`)}</div></div>`;
  const opts=q.t==="tfng"?["TRUE","FALSE","NOT GIVEN"]:q.o;
  return `<div class="tq"><span class="qn">${i+1}</span><div class="t"><div class="en">${q.q}</div><div class="chs">${opts.map((o,j)=>`<button class="ch en" data-q="${pre}${i}" data-v="${j}">${o}</button>`).join("")}</div></div></div>`;
}
function bindChoices(){document.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{document.querySelectorAll(`.ch[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove("sel"));b.classList.add("sel")})}
function gradeQs(qs,pre){
  let ok=0;
  qs.forEach((q,i)=>{
    const key=pre+i; let right, shown;
    if(q.t==="gap"){
      const inp=document.querySelector(`.gap[data-q="${key}"]`);
      right=q.a.includes(normAns(inp.value)); inp.disabled=true;
      inp.classList.add(right?"right":"wrong"); shown=q.a[0];
      if(!right)inp.insertAdjacentHTML("afterend",` <span class="w-ok">(${shown})</span>`);
    }else{
      const correct=q.t==="tfng"?["T","F","NG"].indexOf(q.a):q.a;
      const sel=document.querySelector(`.ch.sel[data-q="${key}"]`);
      right=sel&&+sel.dataset.v===correct;
      document.querySelectorAll(`.ch[data-q="${key}"]`).forEach(x=>{x.disabled=true;if(+x.dataset.v===correct)x.classList.add("right")});
      if(sel&&!right)sel.classList.add("wrong");
    }
    if(right)ok++;
  });
  return ok;
}
function playScript(text){
  if(!("speechSynthesis" in window)){toast("المتصفح ما يدعم تشغيل الصوت");return}
  speechSynthesis.cancel();
  const vs=speechSynthesis.getVoices().filter(v=>/^en/.test(v.lang));
  const v1=voice||vs[0], v2=vs.find(v=>v!==v1&&/en-(GB|AU)/.test(v.lang))||vs.find(v=>v!==v1)||v1;
  text.split("\n").forEach(line=>{
    const m=line.match(/^([AB]):\s*(.*)$/);
    const u=new SpeechSynthesisUtterance(m?m[2]:line);
    u.lang="en-US"; u.rate=0.92;
    if(m&&m[1]==="B"){if(v2)u.voice=v2;u.pitch=1.15}else{if(v1)u.voice=v1;u.pitch=0.95}
    speechSynthesis.speak(u);
  });
}

    const wb=$("#wAiBtn"); if(wb)wb.onclick=async()=>{

      <div style="margin:16px 0 6px"><button class="mic" id="smic">🎤</button></div>
      <p class="mute" id="shint">${SR?"اضغط المايك وجاوب، واضغط مرة ثانية لما تخلص":"متصفحك ما يدعم المايك — جاوب بصوت عالي وكمّل"}</p>
      <div id="strans" class="en" style="text-align:left"></div>
    </div>
    <button class="btn" id="sub" style="width:100%">${T.sq<qs.length-1?"السؤال التالي":"إنهاء المحادثة"}</button>`;
    bindTBack();
    if(isP2){let s=60;const pe=$("#prep");const tk=()=>{if(!$("#prep")||T?.sec!=="S")return;pe.textContent=s>0?`وقت التحضير: ${s} ثانية`:"ابدأ الكلام الحين 🎤";if(s-->0)setTimeout(tk,1000)};tk()}
    $("#smic").onclick=()=>speakAnswer(T.sq);
    $("#sub").onclick=()=>{if(rec)rec.stop();T.sq++;testView()};
    return;
  }
  if(T.sec==="S2"){
    const ans=Object.values(T.sAns), words=ans.reduce((a,x)=>a+x.words,0);
    $("#app").innerHTML=testHead("Speaking",3)+`<div class="card">
      <h3>قيّم محادثتك</h3>
      ${ans.length?`<p class="mute">تكلمت ${words} كلمة في ${ans.length} إجابات${T.sAns[3]?` · Part 2: ${T.sAns[3].words} كلمة في ${Math.round(T.sAns[3].secs)} ثانية`:""}</p>`:""}
      ${aiReady()&&ans.length?`<div id="sai"><button class="btn ok" id="sAiBtn" style="width:100%">🤖 قيّم كلامي تقييم IELTS احترافي</button></div><p class="mute" id="sselfL" style="margin-top:12px">أو قيّم نفسك:</p>`:""}
      <div id="sself">${S_CHECK.map((c,i)=>`<label class="chk"><input type="checkbox" data-i="${i}"> ${c}</label>`).join("")}</div>
    </div>
    <button class="btn" id="sub" style="width:100%">عرض النتيجة</button>`;
    bindTBack();
    if(T.sAI){$("#sai").innerHTML=aiGradeHTML(T.sAI,[["fc","FC"],["lr","LR"],["gra","GRA"]]);$("#sself").hidden=true;$("#sselfL").hidden=true}
    const sb=$("#sAiBtn"); if(sb)sb.onclick=async()=>{
      sb.disabled=true; sb.textContent="⏳ الممتحن يقيّم إجاباتك…";
      const qs=[...t.S.p1,t.S.p2];
      const tr=qs.map((q,i)=>`Q${i+1} (${i<3?"Part 1":"Part 2"}): ${q.replace(/\n/g," ")}\nANSWER: ${T.sAns[i]?.text||"(no answer)"}`).join("\n\n");
      try{T.sAI=pj(await ai(S_SYS,[{role:"user",content:tr}],1200));testView()}
      catch(e){sb.disabled=false;sb.textContent="🤖 قيّم كلامي تقييم IELTS احترافي";toast(aiErr(e))}
    };
    $("#sub").onclick=()=>{T.sCheck=[...document.querySelectorAll(".chk input")].filter(x=>x.checked).length;T.sec="RES";testView()};
    return;
  }
  if(T.sec==="RES"){
    const g=W_GUIDE[t.W.type];
    const lB=pctBand(T.L.ok/5*100), rB=pctBand(T.R.ok/5*100);
    let wB=4.5+T.wCheck*0.5; if(T.wWords<g.min)wB-=0.5; if(T.wWords<g.min/2)wB=Math.min(wB,4); wB=Math.max(3.5,Math.min(7.5,wB));
    const ans=Object.values(T.sAns), avgP1=[0,1,2].map(i=>T.sAns[i]?.words||0).reduce((a,b)=>a+b,0)/3, p2=T.sAns[3]?.words||0;
    let sB=4.5+T.sCheck*0.5+(SR&&ans.length?((avgP1>=20?0.5:0)+(p2>=100?0.5:0)-(p2<40?0.5:0)):0); sB=Math.max(3.5,Math.min(7.5,sB));
    if(T.wAI?.band)wB=+T.wAI.band; if(T.sAI?.band)sB=+T.sAI.band;
    const overall=roundBand((lB+rB+wB+sB)/4);
    const prev=S.ielts?.[t.id];
    S.ielts=S.ielts||{}; S.ielts[t.id]={l:lB,r:rB,w:wB,s:sB,band:overall,best:Math.max(overall,prev?.best||0),date:today()};
    S.ieltsWriting=S.ieltsWriting||{}; S.ieltsWriting[t.id]=T.w;
    const firstTime=!prev; addXP(firstTime?40:10);
    $("#app").innerHTML=`<div class="card" style="text-align:center">
      <p class="mute">اختبار IELTS رقم ${t.n} — تقدير تقريبي</p>
      <div class="band">${overall.toFixed(1)}</div><p><b>Overall Band</b></p>
      <div class="grid4">
        <div><b>${lB.toFixed(1)}</b><span>Listening</span></div><div><b>${rB.toFixed(1)}</b><span>Reading</span></div>
        <div><b>${wB.toFixed(1)}</b><span>Writing</span></div><div><b>${sB.toFixed(1)}</b><span>Speaking</span></div>
      </div>
      ${prev?`<p class="mute">نتيجتك السابقة: ${prev.band.toFixed(1)}</p>`:""}
      <p class="mute" style="font-size:13px">Listening و Reading محسوبة من إجاباتك، و Writing و Speaking ${T.wAI||T.sAI?"مصححة بالذكاء الاصطناعي حسب معايير IELTS":"من تقييمك الذاتي"}. الامتحان الحقيقي أطول (40 سؤال لكل قسم)، فاعتبرها مؤشر لمستواك مو درجة رسمية.</p>
      <button class="btn" id="fin" style="width:100%">${T.onDone?"متابعة":"رجوع"}</button>
    </div>`;
    $("#fin").onclick=()=>{const f=T.onDone;T=null;if(f)f();else render()};
  }
}
function speakAnswer(idx){
  if(!SR){toast("المايك غير مدعوم في هذا المتصفح");return}
  if(rec){rec.stop();return}
  speechSynthesis.cancel();
  const t0=Date.now(); let finalTxt="";
  rec=new SR(); rec.lang="en-US"; rec.continuous=true; rec.interimResults=true;
  $("#smic").classList.add("rec"); $("#shint").textContent="أسمعك… اضغط مرة ثانية لما تخلص";
  rec.onresult=e=>{
    let interim=""; finalTxt="";
    for(const r of e.results){ if(r.isFinal)finalTxt+=r[0].transcript+" "; else interim+=r[0].transcript; }
    const el=$("#strans"); if(el)el.innerHTML=`${esc(finalTxt)}<span class="mute">${esc(interim)}</span>`;
  };
  rec.onerror=e=>{if(e.error==="not-allowed")toast("اسمح للموقع باستخدام المايك")};
  rec.onend=()=>{
    rec=null;
    const words=finalTxt.trim().split(/\s+/).filter(Boolean).length, secs=(Date.now()-t0)/1000;
    if(T&&words){const old=T.sAns[idx];T.sAns[idx]={text:((old?.text||"")+" "+finalTxt).trim(),words:(old?.words||0)+words,secs:(old?.secs||0)+secs}}
    const m=$("#smic"); if(m){m.classList.remove("rec");$("#shint").textContent=words?`✅ سجلت ${T.sAns[idx].words} كلمة — تقدر تكمل أو تروح للسؤال التالي`:"ما سمعت شي، جرّب مرة ثانية"}
  };
  rec.start();
}

/* ====== الإملاء: يمليك الكلمة وأنت تكتبها، والغلط يرجع لك على فترات ====== */
const SPELL_GAPS=[1,2,4,7]; // أيام بين كل مراجعة لكلمة غلطت فيها
const spellDue=()=>Object.entries(S.spell||{}).filter(([,s])=>s.due<=Date.now()).map(([id])=>VOCAB.find(v=>v.id===id)).filter(Boolean);
const spellAll=()=>Object.keys(S.spell||{}).map(id=>VOCAB.find(v=>v.id===id)).filter(Boolean);
function markSpell(v,ok){
  S.spell=S.spell||{};
  const s=S.spell[v.id];
  if(!ok){ S.spell[v.id]={box:0,due:Date.now()+SPELL_GAPS[0]*864e5-36e5,miss:(s?.miss||0)+1}; }
  else if(s){
    s.box++;
    if(s.box>=SPELL_GAPS.length){ delete S.spell[v.id]; S.spellMastered=(S.spellMastered||0)+1; toast(`🏅 أتقنت كتابة ${v.en}`); }
    else s.due=Date.now()+SPELL_GAPS[s.box]*864e5-36e5;
  }
  save();
}
const normSpell=s=>String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim();
function diffHTML(typed,correct){
  const t=normSpell(typed), c=correct.toLowerCase();
  let out="";
  for(let i=0;i<c.length;i++){const ch=c[i]===" "?"&nbsp;":esc(c[i]);out+=t[i]===c[i]?`<span class="lt-ok">${ch}</span>`:`<span class="lt-bad">${ch}</span>`}
  return out;
}
function dictation({list,el="#app",head=()=>"",after=()=>{},onDone,title="إملاء"}){
  let q=shuffle(list).map(v=>({v,retry:false})), i=0, firstOk=0, firstTotal=q.length;
  const missed=new Set();
  const show=()=>{
    if(i>=q.length)return summary();
    const {v,retry}=q[i];
    $(el).innerHTML=head(`${title} — ${Math.min(i+1,firstTotal)}${i>=firstTotal?"+":""} من ${firstTotal}`)+`
      <div class="card" style="text-align:center">
        ${retry?`<span class="badge" style="background:var(--bad2);color:var(--bad)">محاولة ثانية</span>`:`<span class="badge">${v.c==="b"?"أعمال":"عامة"}</span>`}
        <p class="mute" style="margin:10px 0 4px">اسمع واكتب الكلمة</p>
        <div class="row" style="justify-content:center;gap:12px">
          <button class="say big" data-say="${esc(v.en)}">🔊</button>
          <button class="say big" data-say="${esc(v.en)}" data-slow="1">🐢</button>
          <button class="say big" data-say="${esc(v.ex)}" title="اسمعها في جملة">💬</button>
        </div>
        <p style="margin:12px 0 4px">المعنى: <b>${v.ar}</b></p>
        <p class="mute" id="hintL" style="min-height:24px"></p>
        <input id="spIn" class="spin en" dir="ltr" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type here…">
        <div id="spFb"></div>
        <div class="grid" style="margin-top:12px"><button class="btn ghost" id="spHint">💡 تلميح</button><button class="btn" id="spGo">تحقق</button></div>
      </div>`;
    after();
    setTimeout(()=>speak(v.en,0.85),250);
    const inp=$("#spIn"); setTimeout(()=>inp.focus(),300);
    let hintLvl=0;
    $("#spHint").onclick=()=>{hintLvl++;$("#hintL").innerHTML=`<span class="en" style="letter-spacing:4px">${v.en.split("").map((c,k)=>c===" "?"&nbsp;&nbsp;":(k<hintLvl?c:"_")).join("")}</span> <span>(${v.en.replace(/ /g,"").length} حروف)</span>`};
    let checked=false;
    const check=()=>{
      if(checked){i++;show();return}
      if(!inp.value.trim()){inp.focus();return}
      checked=true; inp.disabled=true;
      const ok=normSpell(inp.value)===v.en.toLowerCase();
      if(!retry){
        if(ok&&hintLvl===0){firstOk++;markSpell(v,true);addXP(2)}
        else{markSpell(v,false);missed.add(v.id);if(!ok)q.push({v,retry:true})}
      }
      inp.classList.add(ok?"right":"wrong");
      $("#spFb").innerHTML=ok
        ?`<div class="feedback ok">✅ صح${hintLvl&&!retry?" — بس استخدمت تلميح، بترجع لك للمراجعة":""}</div>`
        :`<div class="feedback bad"><div class="en spword">${diffHTML(inp.value,v.en)}</div><div class="mute">كتبت: <span class="en">${esc(inp.value)}</span></div><div class="mute en" style="margin-top:4px">${v.ex}</div>${retry?"":`<div style="margin-top:4px">بترجع لك آخر الجلسة ومرة ثانية بكرة</div>`}</div>`;
      if(!ok)speak(v.en,0.8);
      $("#spGo").textContent="التالي"; $("#spHint").disabled=true; $("#spGo").focus();
    };
    $("#spGo").onclick=check;
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};
  };
  const summary=()=>{
    const wrong=[...missed].map(id=>VOCAB.find(v=>v.id===id));
    $(el).innerHTML=head(`${title} — النتيجة`)+`<div class="card" style="text-align:center">
      <h2>${firstOk} / ${firstTotal} صح من أول مرة</h2>
      ${wrong.length?`<p>هذي الكلمات انضافت لقائمة أخطائك وبترجع لك بكرة:</p><div class="row" style="justify-content:center">${wrong.map(w=>`<span class="pill en">${w.en}</span>`).join("")}</div>`:`<p>👏 ما غلطت ولا كلمة</p>`}
      <button class="btn" id="spDone" style="width:100%;margin-top:14px">${onDone?"متابعة":"إملاء جديد"}</button></div>`;
    after();
    $("#spDone").onclick=()=>onDone?onDone():render();
  };
  if(!q.length){$(el).innerHTML=`<div class="card mute">ما فيه كلمات للإملاء الحين.</div>`;return}
  show();
}
function spellPick(n=10,cat=""){
  const due=shuffle(spellDue().filter(v=>!cat||v.c===cat));
  const rest=shuffle(learned().filter(v=>(!cat||v.c===cat)&&!due.includes(v)));
  return [...due,...rest].slice(0,Math.max(n,due.length>15?15:due.length));
}
function spellPanel(){
  const all=spellAll(), due=spellDue();
  $("#vbox").innerHTML=`<div class="card">
    <h3>✍️ إملاء</h3>
    <p class="mute">ينطق لك الكلمة وتكتبها. الكلمات اللي تغلط فيها ترجع لك بعد يوم، ثم يومين، ثم 4 أيام، ثم أسبوع — لين تتقنها.</p>
    <div class="grid" style="margin:10px 0"><div class="stat"><b>${due.length}</b><span class="mute">مستحقة الحين</span></div><div class="stat"><b>${S.spellMastered||0}</b><span class="mute">أتقنت كتابتها</span></div></div>
    <button class="btn" id="spStart" style="width:100%">${due.length?`ابدأ (${due.length} كلمة من أخطائك + كلمات ثانية)`:"ابدأ إملاء 10 كلمات"}</button>
  </div>
  ${all.length?`<div class="card"><h3>قائمة أخطائي (${all.length})</h3>${all.map(v=>{const s=S.spell[v.id];const d=Math.ceil((s.due-Date.now())/864e5);return`<div class="item" style="cursor:default"><div class="t"><b class="en">${v.en}</b> — ${v.ar}<div class="mute">غلطت فيها ${s.miss||1} ${(s.miss||1)>1?"مرات":"مرة"} · المرحلة ${s.box+1} من ${SPELL_GAPS.length}</div></div><span class="badge ${d<=0?"":"done"}">${d<=0?"الحين":`بعد ${d} يوم`}</span>${sayBtn(v.en)}</div>`}).join("")}</div>`:""}`;
  $("#spStart").onclick=()=>dictation({list:spellPick(10,vCat),el:"#vbox",onDone:()=>{vMode="spell";Vocab()}});
}

/* ====== الذكاء الاصطناعي (عبر /api/chat على Vercel) ====== */
const AI_URL="/api/chat";
const aiReady=()=>!!user||!!window.__AI_TEST__;
async function ai(system,messages,max=700){
  const token=user?await user.getIdToken():"test";
  const r=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({system,messages,max_tokens:max})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||("HTTP "+r.status));
  return j.text||"";
}
function pj(t){const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw new Error("bad json");return JSON.parse(t.slice(a,b+1))}
const aiErr=e=>/unauthorized|401/.test(e.message)?"سجّل دخول من جديد":/not allowed|403/.test(e.message)?"إيميلك غير مسموح في إعدادات السيرفر":/404/.test(e.message)?"ملف api/chat.js مو مرفوع على Vercel":"تعذّر الاتصال: "+e.message;

// كلمات جديدة تنضاف من المحادثات
function ensureCustom(){for(const w of Object.values(S.customWords||{}))if(!VOCAB.some(v=>v.id===w.en))VOCAB.push({id:w.en,en:w.en,ar:w.ar,ex:w.ex||"",c:"g",day:0})}
function addCustomWords(list){
  S.customWords=S.customWords||{}; let n=0;
  for(const w of list){if(!w?.en||VOCAB.some(v=>v.id.toLowerCase()===w.en.toLowerCase()))continue;S.customWords[w.en]={en:w.en,ar:w.ar||"",ex:w.ex||""};n++}
  ensureCustom();
  for(const w of list)if(w?.en&&S.customWords[w.en]&&!S.cards[w.en])S.cards[w.en]={box:0,due:Date.now()+864e5};
  save(); return n;
}

 {id:"supplier",icon:"🤝",t:"التفاوض مع مورّد",d:"You are Emma, sales manager of a manufacturing company at a big international trade fair. The learner is a buyer from the UAE. Discuss his needs, prices, minimum order quantity, samples, payment terms, shipping and delivery times. Negotiate realistically - don't give discounts too easily."},
 {id:"interview",icon:"💼",t:"مقابلة عمل",d:"You are Emma, an HR manager interviewing the learner for a business development position. Ask typical interview questions one at a time (background, strengths, a challenge he solved, why this job, salary expectations) and react naturally to his answers."},
 {id:"ielts",icon:"🎓",t:"IELTS Speaking",d:"You are an IELTS Speaking examiner. Run a realistic test: Part 1 (4-5 short questions on familiar topics), then Part 2 (give a cue card topic with 3-4 prompts, tell him he has 1 minute to prepare and should speak for 1-2 minutes; while he speaks don't interrupt), then Part 3 (deeper discussion questions related to Part 2). Stay neutral and professional like a real examiner."},
 {id:"meeting",icon:"📊",t:"اجتماع عمل",d:"You are Emma, a colleague/partner in a business meeting with the learner. Plan a new project together: goals, budget, timeline, responsibilities and risks. Ask for his opinion and sometimes politely disagree so he practises discussing."},
 {id:"travel",icon:"✈️",t:"سفر وفندق",d:"Role-play travel situations abroad: start as a hotel receptionist at check-in, then you can become a taxi driver or restaurant waiter as the situation develops. Include small realistic problems (room not ready, wrong order) for him to solve."},
 {id:"free",icon:"💬",t:"موضوع حر",d:"Ask the learner what he would like to talk about today, then have an engaging conversation on that topic, asking follow-up questions."}
];
const talkSystem=sc=>`You are ${PARTNER}, a friendly native English speaker acting as a spoken-English conversation partner for an Arabic-speaking learner from the UAE (intermediate level, around B1-B2, business background).
SCENARIO: ${sc.d}
RULES:
- This is a spoken conversation. Keep each reply short and natural: 1-3 sentences, under 45 words. Ask ONE question at a time to keep him talking - he should speak more than you.
- Use clear, natural everyday English at his level; occasionally use a useful new word or expression.
- His messages come from speech recognition: ignore punctuation/capitalisation and obvious recognition errors. Never correct those.
- Corrections: if his last message had a real grammar or word-choice mistake, put a corrected natural version in "fix" and a very short Arabic explanation in "fix_ar". Otherwise both "". Don't mention corrections inside "reply".
- Messages in square brackets like [START] or [TIME_UP] are signals from the app, not from him.
- Respond ONLY with one JSON object, no other text:
{"reply":"your spoken reply","ar":"Arabic translation of reply","fix":"","fix_ar":"","hints":["a short possible answer he could say","another possible answer"]}`;
const REPORT_SYS=`You are an expert IELTS speaking examiner and English coach. You will receive the transcript of a spoken practice conversation between an Arabic-speaking learner (LEARNER, from speech recognition - ignore punctuation and obvious recognition errors) and a partner (PARTNER). Assess ONLY the learner. Pronunciation cannot be assessed from text, so don't score it.
Respond ONLY with one JSON object:
{"band":6.0,"scores":{"fluency":6.0,"vocabulary":6.0,"grammar":5.5,"coherence":6.0},
"summary_ar":"2-3 sentences in Arabic: overall level and the single most important thing to improve",
"strengths_ar":["..."],
"mistakes":[{"you":"exact phrase he said","better":"natural corrected version","why_ar":"short Arabic reason"}],
"phrases":[{"en":"useful natural phrase he could have used","ar":"meaning"}],
"new_words":[{"en":"word","ar":"Arabic meaning","ex":"example sentence"}],
"next_tip_ar":"one concrete practice tip in Arabic"}
Use IELTS bands in 0.5 steps. Max 6 mistakes (most important first), max 5 phrases, max 5 new_words (useful words related to the topic that he didn't use).`;

let C=null;
function TalkTab(){
  if(C&&C.active){renderTalk();return}
  const hist=(S.talks||[]).slice(-10).reverse();
  const totalMin=Math.round((S.talks||[]).reduce((a,t)=>a+(t.mins||0),0));
  const suggest=SCN[(S.doneDays||0)%(SCN.length-1)];
  if(!aiReady()){
    $("#app").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">🗣️</div><h2>محادثة مع ${PARTNER}</h2>
      <p>تكلم بصوتك مع شريكة محادثة بالذكاء الاصطناعي لمدة 10 دقائق، تصحح أخطاءك وتعطيك تقرير IELTS بالنهاية.</p>
      <p class="mute">${FB_ON?"سجّل دخول عشان تبدأ.":"تحتاج تفعيل Firebase ورفع ملف api/chat.js على Vercel (الخطوات عندك في المحادثة)."}</p>
      ${FB_ON?`<button class="btn" id="tlog">تسجيل الدخول</button>`:""}</div>`;
    const b=$("#tlog"); if(b)b.onclick=()=>$("#authBtn").click();
    return;
  }
  C={sc:suggest.id,mins:10};
  const draw=()=>{
    $("#app").innerHTML=`<div class="card"><h2>🗣️ محادثة مع ${PARTNER}</h2>
      <p class="mute">تكلم بصوتك، وهي ترد عليك بصوت. كل ما تغلط تطلع لك الجملة الصحيحة تحت كلامك، وفي النهاية تقرير كامل بالـ Band.</p>
      <div class="grid" style="margin:10px 0"><div class="stat"><b>${(S.talks||[]).length}</b><span class="mute">محادثة</span></div><div class="stat"><b>${totalMin}</b><span class="mute">دقيقة كلام</span></div></div></div>
    <div class="card"><h3>اختر الموقف</h3><div class="scn">${SCN.map(s=>`<button class="scnb ${s.id===C.sc?"on":""}" data-s="${s.id}"><span>${s.icon}</span>${s.t}${s.id===suggest.id?'<em>مقترح اليوم</em>':""}</button>`).join("")}</div>
      <h3 style="margin-top:14px">المدة</h3><div class="seg" id="tm">${[5,10,15].map(m=>`<button data-m="${m}" class="${m===C.mins?"on":""}">${m} دقائق</button>`).join("")}</div>
      <button class="btn" id="tgo" style="width:100%">📞 ابدأ المحادثة</button>
      <p class="mute" style="font-size:13px;margin-bottom:0">${SR?"استخدم سماعة أو مكان هادي. المايك يشتغل تلقائياً بعد ما تخلص ${PARTNER} كلامها.":"متصفحك ما يدعم المايك، تقدر تكتب ردودك."}</p></div>
    ${hist.length?`<div class="card"><h3>محادثاتك السابقة</h3>${hist.map((t,i)=>{const s=SCN.find(x=>x.id===t.sc)||SCN[0];return`<div class="item" data-h="${(S.talks.length-1-i)}"><div class="t">${s.icon} ${s.t}<div class="mute">${t.date} · ${Math.round(t.mins)} دقيقة · ${t.words} كلمة</div></div>${t.band?`<span class="badge done">Band ${(+t.band).toFixed(1)}</span>`:""}</div>`}).join("")}</div>`:""}`;
    document.querySelectorAll(".scnb").forEach(b=>b.onclick=()=>{C.sc=b.dataset.s;draw()});
    $("#tm").onclick=e=>{const b=e.target.closest("button");if(!b)return;C.mins=+b.dataset.m;draw()};
    $("#tgo").onclick=()=>startTalk(C.sc,C.mins);
    document.querySelectorAll("[data-h]").forEach(it=>it.onclick=()=>{const t=S.talks[+it.dataset.h];if(t.report)showReport(t.report,t,false)});
  };
  draw();
}
function startTalk(scId,mins){
  const sc=SCN.find(s=>s.id===scId);
  C={active:true,sc,mins,msgs:[],log:[],ends:0,started:0,waiting:false,ending:false,words:0,turns:0,hands:true,hints:[]};
  renderTalk();
  C.timer=setInterval(talkTick,1000);
  talkTurn("[START] Greet the learner warmly in one or two sentences and open the scenario with a first question.",true);
}
function renderTalk(){
  $("#app").innerHTML=`<div class="talkbar">
      <div class="row" style="flex:1;gap:10px"><div class="avatar">E</div><div><b>${PARTNER}</b><div class="mute" style="font-size:13px">${C.sc.icon} ${C.sc.t}</div></div></div>
      <span class="pill en" id="ttime">${C.mins}:00</span><button class="btn bad" id="tend" style="padding:7px 12px">إنهاء</button>
    </div>
    <div id="chat"></div>
    <div class="talkin">
      <div id="thint"></div>
      <div class="row" style="flex-wrap:nowrap">
        <button class="mic small" id="tmic">🎤</button>
        <input id="ttxt" class="en" dir="ltr" placeholder="${SR?"تكلم أو اكتب…":"اكتب ردك…"}" autocomplete="off">
        <button class="btn" id="tsend">➤</button>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:6px">
        <button class="linkb" id="thelp">💡 وش أقول؟</button>
        ${SR?`<label class="mute" style="font-size:13px"><input type="checkbox" id="thands" ${C.hands?"checked":""}> مايك تلقائي</label>`:""}
      </div>
    </div>`;
  const chat=$("#chat"); C.log.forEach(e=>chat.insertAdjacentHTML("beforeend",bubble(e)));
  chat.scrollTop=chat.scrollHeight;
  $("#tend").onclick=()=>{if(confirm("تنهي المحادثة وتشوف التقرير؟"))finishTalk()};
  $("#tmic").onclick=()=>{if(rec){rec.stop();return}speechSynthesis.cancel();talkListen()};
  const send=()=>{const v=$("#ttxt").value.trim();if(!v||C.waiting)return;$("#ttxt").value="";if(rec)rec.abort?.();talkTurn(v)};
  $("#tsend").onclick=send; $("#ttxt").onkeydown=e=>{if(e.key==="Enter")send()};
  $("#thelp").onclick=()=>{$("#thint").innerHTML=C.hints?.length?`<div class="hintbox">${C.hints.map(h=>`<button class="hintb en" data-h="${esc(h)}">${esc(h)}</button>`).join("")}<div class="mute" style="font-size:12px">اضغط على الجملة تسمعها، وبعدين قلها بأسلوبك</div></div>`:""; document.querySelectorAll(".hintb").forEach(b=>b.onclick=()=>speak(b.dataset.h,0.85))};
  const hb=$("#thands"); if(hb)hb.onchange=()=>{C.hands=hb.checked};
}
function bubble(e){
  if(e.who==="ai")return `<div class="bub ai"><div class="en">${esc(e.text)}</div><div class="bact"><button class="say sm" data-say="${esc(e.text)}">🔊</button>${e.ar?`<button class="linkb" onclick="this.parentNode.nextElementSibling.hidden=!this.parentNode.nextElementSibling.hidden">ترجمة</button>`:""}</div>${e.ar?`<div class="ar mute" hidden>${esc(e.ar)}</div>`:""}</div>`;
  if(e.who==="me")return `<div class="bub me"><div class="en">${esc(e.text)}</div>${e.fix?`<div class="fix"><span class="en">✏️ ${esc(e.fix)}</span>${e.fix_ar?`<div>${esc(e.fix_ar)}</div>`:""}</div>`:""}</div>`;
  if(e.who==="err")return `<div class="bub err">${esc(e.text)} <button class="linkb" id="tretry">إعادة المحاولة</button></div>`;
  return "";
}
function addLog(e){C.log.push(e);const chat=$("#chat");if(chat){chat.insertAdjacentHTML("beforeend",bubble(e));chat.scrollTop=chat.scrollHeight}}
function setTyping(on){const chat=$("#chat");if(!chat)return;const t=$("#typing");if(on&&!t){chat.insertAdjacentHTML("beforeend",`<div class="bub ai" id="typing"><span class="dots3"><i></i><i></i><i></i></span></div>`);chat.scrollTop=chat.scrollHeight}if(!on&&t)t.remove()}
async function talkTurn(text,signal=false,{auto=true}={}){
  if(!C?.active)return;
  if(!signal){
    const me={who:"me",text};addLog(me);C.lastMe=me;
    C.words+=text.split(/\s+/).filter(Boolean).length;C.turns++;
  }
  C.msgs.push({role:"user",content:text});
  C.waiting=true; setTyping(true); $("#thint")&&($("#thint").innerHTML="");
  try{
    const raw=await ai(talkSystem(C.sc),C.msgs.slice(-40),450);
    if(!C?.active)return;
    let d; try{d=pj(raw)}catch(e){d={reply:raw.replace(/[{}]/g,"").trim()}}
    C.msgs.push({role:"assistant",content:raw});
    setTyping(false); C.waiting=false;
    if(!signal&&d.fix&&C.lastMe){C.lastMe.fix=d.fix;C.lastMe.fix_ar=d.fix_ar||"";const bs=document.querySelectorAll(".bub.me");const last=bs[bs.length-1];if(last)last.insertAdjacentHTML("beforeend",`<div class="fix"><span class="en">✏️ ${esc(d.fix)}</span>${d.fix_ar?`<div>${esc(d.fix_ar)}</div>`:""}</div>`)}
    C.hints=d.hints||[];
    if(!C.started){C.started=Date.now();C.ends=Date.now()+C.mins*60000}
    addLog({who:"ai",text:d.reply||"",ar:d.ar||""});
    speakThen(d.reply||"",()=>{
      if(!C?.active)return;
      if(C.finishAfter){C.finishAfter=false;finishTalk();return}
      if(auto&&C.hands&&!C.ending&&SR)talkListen();
    });
  }catch(e){
    if(!C?.active)return;
    C.msgs.pop(); setTyping(false); C.waiting=false;
    addLog({who:"err",text:aiErr(e)});
    const r=$("#tretry"); if(r)r.onclick=()=>{C.log=C.log.filter(x=>x.who!=="err");renderTalk();if(signal)talkTurn(text,true);else{C.log.pop();C.words-=text.split(/\s+/).length;C.turns--;renderTalk();talkTurn(text)}};
  }
}
function speakThen(text,cb){
  if(!("speechSynthesis" in window)||!text){cb();return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=0.95; if(voice)u.voice=voice;
  let done=false; const fin=()=>{if(!done){done=true;cb()}};
  u.onend=fin; u.onerror=fin; setTimeout(fin,Math.max(4000,text.length*120)); // احتياط إذا ما وصل onend
  speechSynthesis.speak(u);
}
function talkListen(){
  if(!SR||rec||!C?.active||C.waiting)return;
  rec=new SR(); rec.lang="en-US"; rec.continuous=false; rec.interimResults=true;
  let fin="";
  const mic=$("#tmic"), inp=$("#ttxt");
  if(mic)mic.classList.add("rec"); if(inp)inp.placeholder="أسمعك… تكلم";
  rec.onresult=e=>{let it="";fin="";for(const r of e.results){if(r.isFinal)fin+=r[0].transcript;else it+=r[0].transcript}if(inp)inp.value=(fin+" "+it).trim()};
  rec.onerror=e=>{if(e.error==="not-allowed")toast("اسمح للموقع باستخدام المايك")};
  rec.onend=()=>{rec=null;const m=$("#tmic"),i=$("#ttxt");if(m)m.classList.remove("rec");if(i)i.placeholder="تكلم أو اكتب…";
    const said=(fin||i?.value||"").trim(); if(said&&C?.active&&!C.waiting){if(i)i.value="";talkTurn(said)}};
  rec.start();
}
function talkTick(){
  if(!C?.active){clearInterval(C?.timer);return}
  const el=$("#ttime"); if(!C.ends){return}
  const left=Math.max(0,Math.round((C.ends-Date.now())/1000));
  if(el){el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;el.classList.toggle("warn",left<=60)}
  if(left<=0&&!C.ending){
    C.ending=true; if(rec)rec.abort?.();
    if(C.waiting)C.finishAfter=true;
    else talkTurn("[TIME_UP] Our time is up. Say a warm, short goodbye (1-2 sentences) and mention one thing he did well.",true,{auto:false}).then(()=>{C&&(C.finishAfter=true)});
  }
}
function stopTalk(){if(!C)return;C.active=false;clearInterval(C.timer);speechSynthesis.cancel();if(rec){rec.abort?.();rec=null}}
async function finishTalk(){
  if(!C||C.reporting)return; C.reporting=true;
  const snap=C; stopTalk(); C=null;
  const mins=snap.started?(Date.now()-snap.started)/60000:0;
  const transcript=snap.log.filter(e=>e.who!=="err").map(e=>(e.who==="me"?"LEARNER: ":"PARTNER: ")+e.text).join("\n");
  const rec_={date:today(),sc:snap.sc.id,mins:Math.min(mins,snap.mins),words:snap.words,turns:snap.turns};
  if(snap.turns<2){
    $("#app").innerHTML=`<div class="card" style="text-align:center"><h3>المحادثة كانت قصيرة جداً للتقييم</h3><button class="btn" id="bk">رجوع</button></div>`;
    $("#bk").onclick=()=>render(); return;
  }
  $("#app").innerHTML=`<div class="card" style="text-align:center;padding:40px 16px"><div class="dots3 big"><i></i><i></i><i></i></div><p>${PARTNER} تجهز تقريرك…</p></div>`;
  S.talks=S.talks||[]; S.talks.push(rec_); if(S.talks.length>40)S.talks=S.talks.slice(-40);
  addXP(Math.round(rec_.mins*3)+10);
  try{
    const rep=pj(await ai(REPORT_SYS,[{role:"user",content:`Scenario: ${snap.sc.t}\nDuration: ${Math.round(mins)} minutes\n\nTRANSCRIPT:\n${transcript}`}],1600));
    rec_.band=rep.band; rec_.report=rep; save();
    showReport(rep,rec_,true);
  }catch(e){
    save();
    $("#app").innerHTML=`<div class="card" style="text-align:center"><h3>ما قدرت أجهز التقرير</h3><p class="mute">${esc(aiErr(e))}</p><p>تكلمت ${rec_.words} كلمة في ${Math.round(rec_.mins)} دقيقة 👏</p><button class="btn" id="bk">رجوع</button></div>`;
    $("#bk").onclick=()=>render();
  }
}
function showReport(rep,meta,fresh){
  const sc=rep.scores||{}, s=SCN.find(x=>x.id===meta.sc)||SCN[0];
  const crit=[["fluency","Fluency"],["vocabulary","Vocabulary"],["grammar","Grammar"],["coherence","Coherence"]];
  $("#app").innerHTML=`<div class="card" style="text-align:center">
      <p class="mute">${s.icon} ${s.t} · ${Math.round(meta.mins)} دقيقة · ${meta.words} كلمة</p>
      <div class="band">${(+rep.band||0).toFixed(1)}</div><p><b>Speaking Band (تقديري)</b></p>
      <div class="grid4">${crit.map(([k,l])=>`<div><b>${sc[k]!=null?(+sc[k]).toFixed(1):"-"}</b><span>${l}</span></div>`).join("")}</div>
      <p style="text-align:start">${esc(rep.summary_ar||"")}</p></div>
    ${rep.strengths_ar?.length?`<div class="card"><h3>👍 نقاط قوتك</h3><ul>${rep.strengths_ar.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    ${rep.mistakes?.length?`<div class="card"><h3>✏️ أخطاء تصحّحها</h3>${rep.mistakes.map(m=>`<div class="mist"><div class="en wrongt">✗ ${esc(m.you)}</div><div class="en rightt">✓ ${esc(m.better)} ${sayBtn(m.better)}</div><div class="mute">${esc(m.why_ar||"")}</div></div>`).join("")}</div>`:""}
    ${rep.phrases?.length?`<div class="card"><h3>💬 عبارات كان ممكن تستخدمها</h3>${rep.phrases.map(p=>`<div class="item" style="cursor:default"><div class="t"><span class="en">${esc(p.en)}</span><div class="mute">${esc(p.ar||"")}</div></div>${sayBtn(p.en)}</div>`).join("")}</div>`:""}
    ${rep.new_words?.length?`<div class="card"><h3>📚 كلمات جديدة لك</h3>${rep.new_words.map(w=>`<div class="item" style="cursor:default"><div class="t"><b class="en">${esc(w.en)}</b> — ${esc(w.ar||"")}<div class="mute en">${esc(w.ex||"")}</div></div>${sayBtn(w.en)}</div>`).join("")}
      <button class="btn ghost" id="addw" style="width:100%;margin-top:8px">أضفها لبطاقاتي والإملاء</button></div>`:""}
    ${rep.next_tip_ar?`<div class="card"><h3>🎯 تمرين للمرة الجاية</h3><p>${esc(rep.next_tip_ar)}</p></div>`:""}
    <button class="btn" id="bk" style="width:100%">رجوع للمحادثات</button>`;
  scrollTo(0,0);
  const aw=$("#addw"); if(aw)aw.onclick=()=>{const n=addCustomWords(rep.new_words);aw.disabled=true;aw.textContent=n?`✅ انضافت ${n} كلمات`:"✅ موجودة عندك";};
  $("#bk").onclick=()=>{tab="talk";render()};
}

/* ====== تصحيح IELTS بالذكاء الاصطناعي ====== */
const W_SYS=type=>`You are a certified IELTS examiner. Grade this ${type==="letter"?"General Training Writing Task 1 letter (criteria: Task Achievement, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy)":"Writing Task 2 essay (criteria: Task Response, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy)"} strictly according to the public IELTS band descriptors. Penalise under-length (${type==="letter"?150:250} words minimum). The writer is an Arabic speaker; give feedback in Arabic.
Respond ONLY with one JSON object:
{"band":6.0,"tr":6.0,"cc":6.0,"lr":6.0,"gra":5.5,"summary_ar":"...","strengths_ar":["..."],"improve_ar":["..."],"corrections":[{"you":"exact text","better":"corrected","why_ar":"..."}],"improved":"a rewritten version of his weakest paragraph at band 7+"}
Bands in 0.5 steps. Max 6 corrections.`;
const S_SYS=`You are a certified IELTS Speaking examiner. Below are the learner's answers (from speech recognition: ignore punctuation and obvious recognition errors; pronunciation cannot be assessed). Grade Fluency & Coherence, Lexical Resource and Grammatical Range & Accuracy, and give an overall band (0.5 steps). Feedback in Arabic.
Respond ONLY with one JSON object:
{"band":6.0,"fc":6.0,"lr":6.0,"gra":5.5,"summary_ar":"...","corrections":[{"you":"...","better":"...","why_ar":"..."}]}
Max 5 corrections.`;
function aiGradeHTML(d,keys){
  return `<div class="exbox" style="text-align:center"><div class="band" style="font-size:44px">${(+d.band).toFixed(1)}</div>
    <div class="grid4">${keys.map(([k,l])=>`<div><b>${d[k]!=null?(+d[k]).toFixed(1):"-"}</b><span>${l}</span></div>`).join("")}</div></div>
    <p>${esc(d.summary_ar||"")}</p>
    ${d.strengths_ar?.length?`<p><b>👍</b> ${d.strengths_ar.map(esc).join(" · ")}</p>`:""}
    ${d.improve_ar?.length?`<p><b>🎯 حسّن:</b></p><ul>${d.improve_ar.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    ${d.corrections?.length?d.corrections.map(m=>`<div class="mist"><div class="en wrongt">✗ ${esc(m.you)}</div><div class="en rightt">✓ ${esc(m.better)}</div><div class="mute">${esc(m.why_ar||"")}</div></div>`).join(""):""}
    ${d.improved?`<details><summary>نسخة محسّنة من فقرتك</summary><p class="en" style="line-height:1.8">${esc(d.improved)}</p></details>`:""}`;
}

header(); render();
